name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build Nexudus.sln -c Release

      - name: Pack DLL artifact
        run: dotnet build src/Nexudus/Nexudus.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: Nexudus-dll
          path: artifacts/Nexudus.dll
